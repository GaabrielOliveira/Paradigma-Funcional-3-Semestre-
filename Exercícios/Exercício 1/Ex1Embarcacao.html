            { tamanho: 6, potenciaMotor: 55, aberto: false, cabine: true }
        ];

        function ehBarcoPequeno({ tamanho, potenciaMotor, aberto, cabine }) {
            return (
                tamanho <= 5 || 
                (tamanho <= 8 && aberto && potenciaMotor <= 50 && !cabine) ||
                (tamanho <= 8 && !aberto && potenciaMotor <= 50 && !cabine)
            );
        }

        function exibirBarcosPequenos() {
            const listaBarcos = document.getElementById('lista-embarcacoes');
            listaBarcos.innerHTML = ''; 

            const barcosPequenos = barcos.filter(ehBarcoPequeno);

            barcosPequenos.forEach((barco, index) => {
                const item = document.createElement('li');
                item.textContent = `Barco ${index + 1}: Tamanho = ${barco.tamanho}m, Potência do Motor = ${barco.potenciaMotor}HP, Aberto = ${barco.aberto}, Cabine = ${barco.cabine}`;
                listaBarcos.appendChild(item);
            });
        }

        exibirBarcosPequenos();
    </script>
